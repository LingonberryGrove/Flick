name: Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          eval $(ssh-agent -s)
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d | tr -d '\r' > ~/.ssh_key
          chmod 600 ~/.ssh_key
          ssh-add ~/.ssh_key
          rm ~/.ssh_key
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H ${{ vars.PRODUCTION_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          unset DOCKER_HOST
          docker context create production --docker "host=ssh://hasse@${{ vars.PRODUCTION_HOST }}"
          docker context use production
          cat > .env << EOF
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_LIFE=${{ vars.JWT_LIFE }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
          VITE_API_URL=${{ vars.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
          DATABASE_URL=postgres://flick:${{ secrets.DB_PASSWORD }}@db:5432/flick
          EOF
          docker network create flick-network || true
          docker network create proxy || true
          docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.production.yml up -d --build
          docker system prune -f