services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flick
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: flick
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flick"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s

volumes:
  pgdata: